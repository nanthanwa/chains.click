name: Sync Chain Data

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync chain data
        run: npm run sync

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet static/data/ src/lib/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/data/ src/lib/data/
          git commit -m "chore: sync chain data from ethereum-lists/chains

          $(cat static/data/stats.json | jq -r '"Total: \(.total) chains (\(.mainnets) mainnets, \(.testnets) testnets)"')
          Last updated: $(cat static/data/stats.json | jq -r '.lastUpdated')"
          git push
