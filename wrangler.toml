# Cloudflare Pages configuration for chains.click
name = "chains-click"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Pages-specific settings
pages_build_output_dir = ".svelte-kit/cloudflare"

# KV Namespaces for chain data caching
# Create in Cloudflare dashboard: Workers & Pages > KV > Create namespace
# Then update the id below with your namespace ID
[[kv_namespaces]]
binding = "CHAINS_KV"
id = "chains_kv_placeholder"  # Replace with actual KV namespace ID

# Environment variables
[vars]
ENVIRONMENT = "development"

# Production environment overrides
[env.production]
[env.production.vars]
ENVIRONMENT = "production"

# Production KV namespace (create separate namespace for prod)
[[env.production.kv_namespaces]]
binding = "CHAINS_KV"
id = "chains_kv_production"  # Replace with production KV namespace ID

# Staging environment
[env.staging]
[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.kv_namespaces]]
binding = "CHAINS_KV"
id = "chains_kv_staging"  # Replace with staging KV namespace ID
