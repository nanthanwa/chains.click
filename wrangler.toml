# Cloudflare Pages configuration for chains.click
name = "chains-click"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Pages-specific settings
pages_build_output_dir = ".svelte-kit/cloudflare"

# KV Namespaces for chain data caching (to be created in Cloudflare dashboard)
# Uncomment after creating the KV namespace
# [[kv_namespaces]]
# binding = "CHAINS_KV"
# id = "your-kv-namespace-id"

# Environment variables
[vars]
ENVIRONMENT = "development"

# Production environment overrides
[env.production]
[env.production.vars]
ENVIRONMENT = "production"

# Staging environment
[env.staging]
[env.staging.vars]
ENVIRONMENT = "staging"
